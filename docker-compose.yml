services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gbi
      POSTGRES_PASSWORD: gbi_password
      POSTGRES_DB: lap_keu_gbi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbi -d lap_keu_gbi"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://gbi:gbi_password@postgres:5432/lap_keu_gbi
      - DIRECT_URL=postgresql://gbi:gbi_password@postgres:5432/lap_keu_gbi
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-this-secret-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
