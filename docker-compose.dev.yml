services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gbi
      POSTGRES_PASSWORD: gbi_password
      POSTGRES_DB: lap_keu_gbi
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbi -d lap_keu_gbi"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://gbi:gbi_password@postgres:5432/lap_keu_gbi
      - NEXTAUTH_SECRET=local-dev-secret-gbi-jonggol
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data-dev:
